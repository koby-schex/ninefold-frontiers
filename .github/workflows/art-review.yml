name: Great Strider art review
on:
  pull_request:
    paths:
      - 'BuildTools/Art/**'
      - 'SourceArt/GreatStrider/**'
      - '.github/workflows/art-review.yml'
  push:
    branches: [main]
    paths:
      - 'BuildTools/Art/**'
      - 'SourceArt/GreatStrider/**'
      - '.github/workflows/art-review.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/build_great_strider.py
      - run: python BuildTools/Art/validate_great_strider.py
      - run: python BuildTools/Art/render_great_strider.py
      - run: python BuildTools/Art/compare_great_strider.py
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-review-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            SourceArt/GreatStrider/GreatStrider-Review.png
            SourceArt/GreatStrider/GreatStrider-Detail.png
            SourceArt/GreatStrider/GreatStrider-Inspection.png
            SourceArt/GreatStrider/GreatStrider-Mobile.png
            SourceArt/GreatStrider/GreatStrider-Comparison.png
            SourceArt/GreatStrider/manifest.json
  motion:
    name: Motion (${{ matrix.clip }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        clip: [idle, start_stop, turn, walk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/sequence_great_strider.py --clip ${{ matrix.clip }} --frames 32 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-sequence-${{ matrix.clip }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/MotionSequences/
  motion-viewer:
    needs: motion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/move_great_strider.py --validate-only
      - run: node BuildTools/Art/test_strider_sequence_viewer.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: great-strider-sequence-*-${{ github.sha }}
          merge-multiple: true
          path: SourceArt/GreatStrider/MotionSequences/
      - run: python BuildTools/Art/sequence_great_strider.py --pack
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-motion-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/MotionSequences/
  route:
    name: Route chunk (${{ matrix.chunk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/route_great_strider.py --chunk ${{ matrix.chunk }} --chunks 4 --frames 192 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-route-chunk-${{ matrix.chunk }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/MotionRoute/
  route-viewer:
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: great-strider-route-chunk-*-${{ github.sha }}
          merge-multiple: true
          path: SourceArt/GreatStrider/MotionRoute/
      - run: python BuildTools/Art/route_great_strider.py --pack --chunks 4 --frames 192
      - run: node BuildTools/Art/test_strider_route_viewer.cjs SourceArt/GreatStrider/MotionRoute/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-route-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            SourceArt/GreatStrider/MotionRoute/index.html
            SourceArt/GreatStrider/MotionRoute/checks.json
            SourceArt/GreatStrider/MotionRoute/preview.png
  deformation:
    name: Deformation comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/inspect_strider_deformation.py
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-deformation-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/DeformationReview/

  surface:
    name: Surface comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/test_review_transparency.py
      - run: python BuildTools/Art/review_strider_surface.py
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-surface-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/SurfaceReview/

  connections:
    name: Connection and rider comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - run: python BuildTools/Art/review_strider_connections.py
      - uses: actions/upload-artifact@v4
        with:
          name: great-strider-connections-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: SourceArt/GreatStrider/ConnectionReview/
