name: Playable starter roster model review
on:
  pull_request:
    paths:
      - 'Assets/Ninefold/Resources/WorldFiveBondModels/**'
      - 'Assets/Ninefold/Runtime/Core/Content/PlayableBond*.cs'
      - 'Assets/Ninefold/Runtime/Presentation/PlayableBondBattleArt.cs'
      - 'Assets/Ninefold/Runtime/Presentation/PlaytestBattlefield.cs'
      - 'BuildTools/Art/PlayableBondMeshExport/**'
      - 'BuildTools/Art/review_playable_bond_models.py'
      - 'BuildTools/Art/mesh_depth_raster.py'
      - '.github/workflows/playable-bond-model-review.yml'
permissions:
  contents: read
jobs:
  exact-source-rig-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Export actual packed rest and rigged pose meshes
        run: dotnet run --project BuildTools/Art/PlayableBondMeshExport/PlayableBondMeshExport.csproj --configuration Release -- Assets/Ninefold/Resources/WorldFiveBondModels PlayableBondReview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BuildTools/Art/requirements-review.txt
      - name: Render exact four complete playable pair models in one review
        run: python BuildTools/Art/review_playable_bond_models.py Assets/Ninefold/Resources/WorldFiveBondModels PlayableBondReview
      - uses: actions/upload-artifact@v4
        with:
          name: playable-bond-roster-actual-mesh-review
          path: |
            PlayableBondReview/*.png
            PlayableBondReview/*.json
          retention-days: 30
          if-no-files-found: error
