name: Ashbound model source checks
on:
  pull_request:
    paths:
      - 'SourceArt/Ashbound/**'
      - 'BuildTools/Art/build_ashbound.mjs'
      - '.github/workflows/ashbound-model-review.yml'
      - 'Assets/Ninefold/Editor/AshboundEnemyReview.cs'
  push:
    branches: [main]
    paths:
      - 'SourceArt/Ashbound/**'
      - 'BuildTools/Art/build_ashbound.mjs'
      - '.github/workflows/ashbound-model-review.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild both enemy models from source
        run: node BuildTools/Art/build_ashbound.mjs
      - name: Verify reproducible checked-in OBJ, MTL and manifests
        run: git diff --exit-code -- SourceArt/Ashbound
      - name: Verify no trailing whitespace errors
        run: git diff --check
      - name: Verify two separate enemy studies exist
        run: |
          test -s SourceArt/Ashbound/RiftForager/RiftForager.obj
          test -s SourceArt/Ashbound/PartedStriker/PartedStriker.obj
          node -e "for (const n of ['RiftForager','PartedStriker']) { const m=require('./SourceArt/Ashbound/'+n+'/manifest.json'); if (!m.bipedal_avarin||!m.living_crescent_mantle||m.bonded_creature_count!==0||m.rigged||m.triangles<10000) throw Error(n+' invalid model'); }"
